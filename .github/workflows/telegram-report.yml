name: Monthly Telegram report
on:
  schedule:
    # UTC 01:00 = Asia/Taipei 09:00; month-end candidates are filtered below.
    - cron: '0 1 5,15,28-31 * *'
  workflow_dispatch:
    inputs:
      banks:
        description: '指定銀行名稱或代碼（空格或逗號分隔，如 上海 彰銀）；留白查全部'
        required: false
        default: ''
      balances_only:
        description: '只查餘額並傳 Telegram，略過信箱下載與 PDF 解析'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: telegram-report
  cancel-in-progress: false
jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_report: ${{ steps.calendar.outputs.run_report }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Taiwan report date
        id: calendar
        run: python3 report_schedule.py
  report:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_report == 'true'
    # CTBC and Shanghai's public login pages reject Linux.
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v tesseract >/dev/null; then
            brew install tesseract
          fi
          python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Run pipeline and deliver report
        env:
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_ENV: ${{ secrets.REPORT_ENV }}
          REPORT_BANKS: ${{ inputs.banks }}
          REPORT_BALANCES_ONLY: ${{ inputs.balances_only }}
        run: python telegram_report.py
