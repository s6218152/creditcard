name: Monthly Telegram report
on:
  schedule:
    # UTC 04:00 = Asia/Taipei 12:00; execution and delivery may be delayed.
    - cron: '0 4 1,15 * *'
  workflow_dispatch:
    inputs:
      banks:
        description: '指定銀行名稱或代碼（空格或逗號分隔，如 上海 彰銀）；留白查全部'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: telegram-report
  cancel-in-progress: false
jobs:
  report:
    # CTBC and Shanghai's public login pages reject Linux.
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v tesseract >/dev/null; then
            brew install tesseract
          fi
          python -m pip install -r requirements.txt
      - name: Run pipeline and deliver report
        env:
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_ENV: ${{ secrets.REPORT_ENV }}
          REPORT_BANKS: ${{ inputs.banks }}
        run: python telegram_report.py
